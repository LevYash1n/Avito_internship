[project]
name = "avito-internship"
version = "0.1.0"
description = "Hybrid candidate retrieval for Avito service search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.13.0",
    "ipykernel>=7.3.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=5.1.0",
    "torch==2.14.0",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
